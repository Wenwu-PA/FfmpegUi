appId: com.frameforge.ffmpegstudio
productName: FFmpeg Studio
copyright: Copyright © 2026 Wenwu-PA
directories:
  output: release/optimized
asar: true
compression: maximum
electronLanguages:
  - ru
  - en-US
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/*.map'
  - '!**/*.tsbuildinfo'
  - '!**/*.test.*'
  - '!**/*.spec.*'
  - '!**/*.md'
  - '!src/**'
  - '!tests/**'
  - '!docs/**'
  - '!build/icon.svg'
  - '!build/icons/**'
  - '!node_modules/7zip-bin/linux/**'
  - '!node_modules/7zip-bin/mac/**'
  - '!node_modules/7zip-bin/win/arm64/**'
  - '!node_modules/7zip-bin/win/ia32/**'
extraResources:
  - from: build/icon.png
    to: icons/icon.png
  - from: build/tray-icon.png
    to: icons/tray-icon.png
  - from: resources/ffmpeg-sources.json
    to: ffmpeg-sources.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: ${productName} Setup ${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FFmpeg Studio
portable:
  artifactName: ${productName} ${version}.${ext}
mac:
  icon: build/icon.icns
linux:
  icon: build/icons
